# GitHub Pages publication workflow for foundry-web.
# Conformance ID: PP-01 (suite: publication-pipeline)
name: pages publication

on:
  workflow_run:
    workflows: [bootstrap]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export:
    name: verify / immutable producer export
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      sdk-image: ${{ steps.identity.outputs.sdk-image }}
    steps:
      - name: Check out the exact event revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful complete bootstrap on this exact current main revision
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$PUBLISH_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bootstrap.yml/runs?head_sha=$PUBLISH_SHA&status=success&per_page=100" |
            jq -e --arg sha "$PUBLISH_SHA" --arg repo "$GITHUB_REPOSITORY" \
              'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success")'
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          [[ $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]
          printf 'revision=%s\nsdk-image=%s\n' "$PUBLISH_SHA" "$image" >> "$GITHUB_OUTPUT"

      - name: Export and verify unchanged browser artifacts
        env:
          SDK_IMAGE: ${{ steps.identity.outputs.sdk-image }}
        run: |
          set -euo pipefail
          docker pull "$SDK_IMAGE"
          chmod go-w "$PWD"
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --entrypoint bash "$SDK_IMAGE" scripts/export_browser.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  publish:
    name: publish / github-pages
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a superseded main revision before privileged deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ needs.export.outputs.revision }}
        run: |
          set -euo pipefail
          test "$PUBLISH_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  audit-live:
    name: audit / deployed application (not acceptance)
    needs: [export, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
      deployments: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.export.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Observe the exact Pages deployment and enforced HTTPS target
        env:
          SDK_IMAGE: ${{ needs.export.outputs.sdk-image }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ needs.export.outputs.revision }}
          PAGES_DEPLOYED_URL: ${{ needs.publish.outputs.page-url }}
        run: |
          set -euo pipefail
          chmod go-w "$PWD"
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --env GH_TOKEN --env GITHUB_REPOSITORY --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env PUBLISH_SHA --env PAGES_DEPLOYED_URL \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --entrypoint node "$SDK_IMAGE" scripts/observe-pages.mjs
      - name: Replay exact live byte integrity through the locked SDK
        env:
          SDK_IMAGE: ${{ needs.export.outputs.sdk-image }}
        run: |
          set -euo pipefail
          chmod go-w "$PWD"
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --entrypoint node "$SDK_IMAGE" scripts/verify-publication.mjs
      - name: Audit public assets and every visible view in three browser engines
        env:
          SDK_IMAGE: ${{ needs.export.outputs.sdk-image }}
        run: |
          set -euo pipefail
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --entrypoint bash "$SDK_IMAGE" -c \
            'npm ci --cache /tmp/foundry-publisher-npm --ignore-scripts --no-audit --no-fund && npm run audit:deployed -- --selected'
      - name: Reobserve current deployment after all live audits
        env:
          SDK_IMAGE: ${{ needs.export.outputs.sdk-image }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SHA: ${{ needs.export.outputs.revision }}
          PAGES_DEPLOYED_URL: ${{ needs.publish.outputs.page-url }}
          PAGES_OBSERVATION_PHASE: final
        run: |
          set -euo pipefail
          chmod go-w "$PWD"
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --env GH_TOKEN --env GITHUB_REPOSITORY --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env PUBLISH_SHA --env PAGES_DEPLOYED_URL --env PAGES_OBSERVATION_PHASE \
            --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace \
            --entrypoint node "$SDK_IMAGE" scripts/observe-pages.mjs
      - name: Retain observations and negative-audit diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
