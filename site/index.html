<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundry — draft preview</title><link rel="stylesheet" href="app.css"></head><body><main><h1>Local draft preview</h1><form id="application-form" novalidate><label for="request">Draft text (maximum 4,096 UTF-8 bytes)</label><textarea id="request" rows="8" aria-describedby="result"></textarea><button id="submit" type="submit" disabled>Preview draft</button></form><label id="response-label" for="result">Unpublished local preview</label><output id="result" for="request" role="status" aria-labelledby="response-label" aria-live="polite" aria-atomic="true">The draft preview could not be produced. Your input has not been published.</output></main><script type="module" src="app.js"></script></body></html>
