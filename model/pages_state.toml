# Desired GitHub Pages policy, not observed deployment evidence.
#
# Conformance ID: PS-01 (suite: pages-state)

spec = "foundry/pages-state/1"
stage = "staged-core"

[policy]
require_active_deployment = true
require_https_enforcement = true
require_pages_artifact_verification = true
prohibit_unverified_pages_origin = true
prohibit_stale_deployments = true

[deployment_target]
origin = "https://uor-foundation.github.io"
subpath = "/foundry-web/"
url = "https://uor-foundation.github.io/foundry-web/"
environment = "github-pages"
branch = "main"
build_type = "workflow"
min_deployment_count = 1

[https_enforcement]
enforced = true
tls_version = "TLSv1.3"

[artifact_verification]
expected_artifact_name = "github-pages"
expected_asset_count = 6
