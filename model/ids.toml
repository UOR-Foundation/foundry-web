# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The register is empty. This repository has no claims yet; adding one starts
# with a row here, in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "PW-01"
level = "build"
suite = "publisher-sdk"
statement = "The publisher SDK and template boundary enforces immutable multi-architecture OCI SDK verification across linux/amd64 and linux/arm64, approved export-browser interfaces, offline dependency closure, and parity between local and CI execution contracts without source integration or draft preview shortcuts."

[[id]]
id = "PB-01"
level = "build"
suite = "publisher-binding"
statement = "The publisher binding establishes immutable verification of the exact authorized uor-foundry producer release identity, pre-publication evidence, and bit-for-bit reproducible artifact tree closure, while enforcing explicit dependency on complete producer platform acceptance without conflating staged core publication with full platform scope."

