# model/publication_pipeline.toml --- Source-free export-browser and
# Actions publication specification for GitHub Pages.
#
# Conformance ID: PP-01 (suite: publication-pipeline)

spec = "foundry/publication-pipeline/1"
stage = "staged-core"

[policy]
require_source_free_export = true
require_unchanged_asset_publication = true
require_pre_upload_byte_verification = true
prohibit_arbitrary_oci_extraction = true
prohibit_producer_build_workflow_reuse = true
prohibit_compilation_in_pipeline = true

[pipeline]
workflow_path = ".github/workflows/pages.yml"
environment = "github-pages"
target_branch = "main"
export_directory = "site"
